name: Release

on:
  push:
    tags:
      - 'v*'
  # Build without releasing — useful for checking that a change still bundles.
  workflow_dispatch:
  # Called by bump.yml right after it pushes the tag. A tag pushed with
  # GITHUB_TOKEN does not trigger the `push` event above, so the bump workflow
  # has to invoke this one directly.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

env:
  TARGET: aarch64-apple-darwin

jobs:
  build:
    # Apple Silicon only. The Intel matrix entry (macos-13) sat in the queue for
    # 24h and was cancelled on the v0.1.0 run; the README already points Intel
    # users at a source build.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ env.TARGET }}

      # The README links to a fixed, version-less filename under
      # /releases/latest/download/, so the name must not change between
      # releases. Tauri does not emit a zip, so we make one from the .app.
      - name: Package .app as zip
        run: |
          ditto -c -k --keepParent \
            "src-tauri/target/${TARGET}/release/bundle/macos/Bellboy.app" \
            Bellboy_aarch64.zip

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            Bellboy_aarch64.zip
