name: Bump version

# Raise the version, tag it, and hand off to Release. Run this from `main`.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package.json is the single source of truth — tauri.conf.json reads its
      # version from there. Cargo.toml/lock only need to stay consistent.
      - name: Bump package.json
        id: version
        run: |
          VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version | tr -d 'v\n')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync Cargo manifests
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only the [package] version at the top of Cargo.toml.
          perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ if $. < 10' src-tauri/Cargo.toml
          perl -0pi -e 's/(\[\[package\]\]\nname = "bellboy"\nversion = ")[^"]*/${1}$ENV{VERSION}/' src-tauri/Cargo.lock

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: release $TAG"
          git tag "$TAG"
          git push origin HEAD --tags

  release:
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
